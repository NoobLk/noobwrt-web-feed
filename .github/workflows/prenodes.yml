name: Run prenodes.sh on release changes

on:
  push:
    branches: ["master"]
    paths:
      - "releases/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prenodes:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run prenodes.sh
        run: bash prenodes.sh

      - name: Commit changes if any
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-generate index.md files from prenodes.sh"
            git push
          fi
